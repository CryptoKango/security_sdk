name: Flutter compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  portable-example:
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.38.10', '3.44.9', '3.50.0', 'stable']
        include:
          - runner: ubuntu-latest
            native: android
          - runner: macos-15
            native: ios
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
          cache: true
      - name: Resolve, analyze, test and build isolated consumer
        shell: bash
        run: >-
          python3 tool/check_flutter_compatibility.py
          --flutter "$(command -v flutter)"
          --native "${{ matrix.native }}"
          --output "${{ runner.temp }}/security-compat"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.flutter }}-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/security-compat/report.json
            ${{ runner.temp }}/security-compat/1/report.json
            ${{ runner.temp }}/security-compat/1/*.log
