name: security_flutter
description: Explicit Flutter access to local security capability adapters.
version: 0.1.0-dev.1
publish_to: none
resolution: workspace
environment:
  sdk: '>=3.10.9 <4.0.0'
  flutter: '>=3.38.10'
dependencies:
  flutter:
    sdk: flutter
  security_core: ^0.1.0-dev.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.securitysdk.security_flutter
        pluginClass: SecurityFlutterPlugin
      ios:
        pluginClass: SecurityFlutterPlugin
